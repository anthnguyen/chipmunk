[project]
name = "chipmunk"
version = "0.1.0"
description = "Toggleable model organism: where a trained-in lie lives, and how much was already there"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "transformers>=5.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "accelerate>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chipmunk"]
